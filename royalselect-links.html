<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رويال سيليكت | تواصل معنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E1;--ink:#12302A;--gold:#9A7424;--card:#FFFBF0;--line:#D9C9A0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2A23;--ink:#F5EFE0;--gold:#D4AF5A;--card:#16372F;--line:#2F5a4d}}
:root[data-theme="dark"]{--bg:#0F2A23;--ink:#F5EFE0;--gold:#D4AF5A;--card:#16372F;--line:#2F5a4d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:44px 20px 40px}
h1{font-family:'Reem Kufi',Cairo,serif;font-weight:600;font-size:40px;margin:0;color:var(--gold);text-align:center;letter-spacing:.5px}
.sub{text-align:center;margin:6px 0 4px;font-size:17px}
.since{text-align:center;font-size:15px;opacity:.75;margin:8px 0 32px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:600}
a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a.btn:active{transform:scale(.99)}
a.btn svg{width:26px;height:26px;flex:none;fill:var(--gold)}
a.btn small{display:block;font-weight:400;font-size:13px;opacity:.7}
</style>
</head>
<body>
<main>
<h1>رويال سيليكت</h1>
<p class="since">منذ 1996</p>
<ul>
<li><a class="btn" id="wa" href="#"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.2.1.400 0 .5l-.4.600c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.100.100.100.600-.100 1.200z"/></svg><span>واتساب<small>كلمنا مباشرة</small></span></a></li>
<li><a class="btn" id="fb" href="#"><svg viewBox="0 0 24 24"><path d="M13.500 22v-8.500h2.900l.5-3.500h-3.400V7.900c0-1 .3-1.700 1.700-1.700H17V3.100C16.700 3 15.700 2.900 14.500 2.900c-2.500 0-4.200 1.500-4.200 4.300V10H7.400v3.500h2.900V22z"/></svg><span>فيسبوك<small>تابع صفحتنا</small></span></a></li>
<li><a class="btn" id="ig" href="#"><svg viewBox="0 0 24 24"><path d="M7.800 2h8.400A5.800 5.800 0 0 1 22 7.800v8.400a5.800 5.800 0 0 1-5.800 5.800H7.800A5.800 5.800 0 0 1 2 16.200V7.800A5.800 5.800 0 0 1 7.800 2zm-.2 2A3.600 3.600 0 0 0 4 7.600v8.800A3.600 3.600 0 0 0 7.600 20h8.800a3.600 3.600 0 0 0 3.600-3.600V7.600A3.600 3.600 0 0 0 16.400 4zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.300-3.200a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400z"/></svg><span>انستجرام<small>شوف أحدث التصميمات</small></span></a></li>
<li><a class="btn" id="map" href="#"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.200 7 13 7 13s7-7.800 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg><span>الموقع على الخريطة<small>افتح الاتجاهات</small></span></a></li>
</ul>
</main>
<script>
// عدّل الروابط هنا بس
var LINKS={
  wa:"",
  fb:"https://www.facebook.com/share/1E5U3gaLVi/",
  ig:"https://www.instagram.com/royal__select",
  map:"https://www.google.com/maps/search/?api=1&query=3725%2BRMV+El+Gamaliya+Cairo"

</script>
</body>
</html>
